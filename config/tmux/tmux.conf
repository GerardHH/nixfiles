set-option -g default-shell /bin/bash

# Clipboard
# tmux defaults to set-clipboard=external: it passes an application's OSC 52
# through, but never sets the clipboard for its own copy-mode selections.
# `on` makes tmux emit OSC 52 itself, so the terminal that owns the real
# clipboard does the work — no helper binary needed inside the session. This
# is what makes copy behave the same locally, over SSH and in a container.
set -s set-clipboard on
set -as terminal-features ',*:clipboard'

# Mouse drag and vi-style selection both end in a copy command, so the
# OSC 52 actually fires.
setw -g mode-keys vi
set -s copy-command 'if [ -n "$WAYLAND_DISPLAY" ]; then wl-copy --primary; \
                     elif [ -n "$DISPLAY" ]; then xclip -selection primary -in; \
                     else cat >/dev/null; fi'
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-no-clear
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-no-clear

# Enable full colours
set -as terminal-features ',*:RGB'

# Enable mouse
set -g mouse on

# Unset prefix (tmux-which-key will do prefix work)
unbind C-b
set-option -g prefix None

# Ctrl + vim motions for pane selection
bind -n C-h select-pane -L
bind -n C-j select-pane -D
bind -n C-k select-pane -U
bind -n C-l select-pane -R

# Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

set -g @catppuccin_flavour 'mocha'

# Move status bar to top
set-option -g status-position top

# Make tmux-which-key search in .config folder
set -g @tmux-which-key-xdg-enable 1
set -g @tmux-which-key-xdg-plugin-path tmux/plugins/tmux-which-key # default

# Disable slow ESC key
set -s escape-time 0

# Plugins
set -g @plugin 'alexwforsythe/tmux-which-key'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'dreamsofcode-io/catppuccin-tmux'

# Install plugins in ~/.tmux/plugins
set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.tmux/plugins'

# Bootstrap tpm and install plugins
if "test ! -d ~/.tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
